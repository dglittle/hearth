<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🪶 {{AGENT_NAME}} — card board</title>
<style>
  :root {
    --bg:#0d1014; --card:#171c22; --card2:#12161b; --ink:#d7dee6; --dim:#8a97a5;
    --line:#2b3540; --sel:#3f96ff;
    --c-mind:#e05563; --c-short-term:#e8a33d; --c-long-term:#9d8cff; --c-human:#4ea3f0;
    --c-{{AGENT_NAME}}:#5fc88f; --c-erg:#5fd3a5;
    --c-output:var(--c-{{AGENT_NAME}}); /* legacy alias (limits dials etc.) */
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg);
    color:var(--ink); font:13px/1.4 -apple-system,"Segoe UI",Helvetica,sans-serif; }

  #bar { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; gap:8px;
    align-items:center; padding:7px 12px; background:rgba(13,16,20,.9);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #bar b { font-size:14px; }
  #bar .leg { display:flex; gap:8px; align-items:center; color:var(--dim); font-size:11px; flex-wrap:wrap; }
  #bar .leg i { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:3px; }
  button { background:var(--card); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:5px 11px; font-size:12px; cursor:pointer; }
  button:active { background:var(--line); }
  button.on { border-color:var(--sel); color:#9ec9ff; }
  #findn { width:58px; background:#0d1014; color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:5px 8px; font-size:12px; }
  #findn:focus { outline:none; border-color:var(--sel); }
  #back:disabled { opacity:.35; cursor:default; }
  #ergrun { color:var(--c-erg); font-size:12px; display:none; }
  #stamp { color:var(--dim); font-size:11px; margin-left:auto; }

  /* limits dials (ported from the watch-page — M5 follow-up, card #252) */
  #limits { display:flex; flex-wrap:wrap; gap:.2em .9em; align-items:center;
    font-size:11px; color:var(--dim); }
  #limits .lab { color:#c9a86a; letter-spacing:.04em; }
  #limits .tok { display:flex; gap:.55em; align-items:center; white-space:nowrap; }
  #limits .tn { color:var(--ink); }
  #limits .dial { display:inline-flex; flex-direction:column; gap:1px; line-height:1.2; }
  #limits .dial b { font-weight:600; color:var(--c-output); }
  #limits .dial.warn b { color:#e8b33f; }
  #limits .dial.crit b { color:#d9756b; }
  /* dual bars per dial: top = usage, bottom (blue) = window elapsed */
  #limits .bar { width:52px; height:3px; background:#20242c; border-radius:2px; overflow:hidden; }
  #limits .bar i { display:block; height:100%; background:var(--c-output); border-radius:2px; }
  #limits .dial.warn .bar.use i { background:#e8b33f; }
  #limits .dial.crit .bar.use i { background:#d9756b; }
  #limits .bar.time { height:2px; }
  #limits .bar.time i { background:#5d84a9; }
  #limits .asof { color:#565962; }
  #limits button { padding:2px 7px; font-size:11px; border-radius:6px; }

  #viewport { position:fixed; inset:0; touch-action:none; cursor:grab; overflow:hidden; }
  #viewport.panning { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; transform-origin:0 0; }
  svg { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
  .e-child { stroke:#61718280; stroke-width:2.5; fill:none; }
  .e-ref { stroke:#b58a3d99; stroke-width:1.6; stroke-dasharray:5 5; fill:none; }
  .axis { stroke:#243040; stroke-width:2; }
  .qlbl { fill:#3a4a5c; font:600 15px -apple-system,sans-serif; }

  .node { position:absolute; background:var(--card); border:1.5px solid var(--line);
    border-radius:9px; padding:6px 9px 5px; overflow:hidden; cursor:pointer; }
  .node .top { display:flex; gap:6px; align-items:baseline; font-size:10.5px; color:var(--dim);
    white-space:nowrap; overflow:hidden; }
  .node .top .st { font-weight:600; }
  .node .top .ts { margin-left:auto; color:#5c6875; font-size:10px; flex-shrink:0; }
  .node .meta { margin-top:4px; font-size:10.5px; color:var(--dim); }
  .node .ttl { margin-top:2px; font-size:12px; font-weight:600; line-height:1.3; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .node .txt { margin-top:3px; font-size:11.4px; line-height:1.35; color:#b8c2cd;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    word-break:break-word; }
  .node .txt a, .node .txt code { color:#8fb8e8; }
  .node .txt code { background:#0d1014; padding:0 3px; border-radius:3px; color:#c9a86a; }
  .node.expanded { z-index:9; overflow:visible; height:auto !important; min-height:60px;
    width:360px !important; box-shadow:0 10px 34px #000b; }
  .node.expanded .ttl, .node.expanded .txt { -webkit-line-clamp:unset; }
  /* open cards: selectable text (cards are HTML, not canvas — the operator 2026-07-29, #374) */
  .node.expanded .ttl, .node.expanded .txt, .node.expanded .meta {
    user-select:text; -webkit-user-select:text; cursor:text; }
  /* full-markdown blocks (rendered only in the open view — #374) */
  .node .txt p { margin:.35em 0; }
  .node .txt p:first-child { margin-top:0; }
  .node .txt h1, .node .txt h2, .node .txt h3, .node .txt h4 {
    margin:.6em 0 .25em; line-height:1.25; color:var(--ink); }
  .node .txt h1 { font-size:14.5px; } .node .txt h2 { font-size:13.5px; }
  .node .txt h3 { font-size:12.5px; } .node .txt h4 { font-size:12px; }
  .node .txt ul, .node .txt ol { margin:.35em 0; padding-left:1.4em; }
  .node .txt li { margin:.15em 0; }
  .node .txt pre { background:#0d1014; border:1px solid var(--line); border-radius:6px;
    padding:7px 9px; overflow-x:auto; margin:.45em 0; }
  .node .txt pre code { background:none; padding:0; display:block; white-space:pre; }
  .node .txt blockquote { margin:.45em 0; padding:2px 10px;
    border-left:3px solid var(--line); color:var(--dim); }
  .node .txt hr { border:0; border-top:1px solid var(--line); margin:.6em 0; }
  /* parent-link chips in the OPEN view — ✕ breaks the link (the operator 2026-07-29, #408) */
  .node .plinks { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; font-size:10.5px; }
  .node .plinks .pl { background:#0d1014; border:1px solid var(--line); border-radius:6px;
    padding:1px 2px 1px 7px; color:var(--dim); display:inline-flex; align-items:center; gap:2px; }
  .node .plinks .pl button.b-unlink { background:none; border:none; color:#d9756b;
    font-size:11px; padding:0 5px; cursor:pointer; }
  .node .plinks .pl button.b-unlink:hover { color:#ff9d93; }
  .node .btns { position:absolute; right:4px; top:2px; display:flex; gap:1px; }
  .node .btns button { background:none; border:none; color:var(--dim); font-size:12px; padding:1px 3px; }
  .node .btns button:hover { color:var(--ink); }
  .node.k-mind { border-left:4px solid var(--c-mind); }
  .node.k-short-term { border-left:4px solid var(--c-short-term); }
  .node.k-long-term { border-left:4px solid var(--c-long-term); }
  .node.k-human { border-left:4px solid var(--c-human); }
  .node.k-{{AGENT_NAME}} { border-left:4px solid var(--c-{{AGENT_NAME}}); }
  .node.k-erg { border-left:4px solid var(--c-erg); }
  /* header cards (the operator 2026-07-30, #425): big-font section titles for the board.
     Drag/select like any card, 2×tap edits; no chrome, no body, never expands.
     Always gold — headers are exempt from the fresh/seen color shift (the operator
     2026-07-30, #464: the old slate-blue "seen" color looked like stuck
     selection, since first tap = markSeen = gold→blue at the moment of select). */
  .node.k-header { background:none; border:none; padding:2px 8px; overflow:visible; }
  .node.k-header .httl { font:800 34px/1.15 -apple-system,"Segoe UI",Helvetica,sans-serif;
    color:#e8c15a; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .node.k-header.fresh { background:none; border-color:transparent; }
  .node.k-header.arch { opacity:.25; }
  .node.st-done .ttl { color:var(--dim); }
  .node.arch { opacity:.38; }
  .node.sel { outline:2.5px solid var(--sel); outline-offset:2px; opacity:1; }
  /* fresh = never touched in THIS browser (the operator 2026-07-29, #372 + #381): static
     gold-tinted BACKGROUND + gold border + ✦ new badge, until tapped/expanded/
     dragged/lassoed. No animation — pulsing is reserved for things that end on
     their own (live ergs, .pulse below). */
  .node.fresh { background:#2c2410; border-color:#e8c15a; }
  .node .nb { color:#e8c15a; font-weight:700; flex-shrink:0; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 1.5px #5fd3a566, 0 0 8px #5fd3a522; }
    50%     { box-shadow:0 0 0 2.5px #5fd3a5,   0 0 26px #5fd3a599; } }
  .node.pulse { animation:pulse 1.6s ease-in-out infinite; }

  #band { position:fixed; z-index:15; border:1.5px dashed var(--sel); background:#3f96ff14;
    display:none; pointer-events:none; }

  #abar { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:25;
    display:none; gap:6px; align-items:center; background:#151b22ee; border:1px solid var(--line);
    border-radius:12px; padding:7px 12px; box-shadow:0 8px 30px #000a; flex-wrap:wrap;
    justify-content:center; max-width:96vw; }
  #abar span { color:var(--dim); font-size:12px; margin-right:4px; }
  #abar button.warn { border-color:#7a4a4a; }
  #abar button.go { background:#2b4a71; border-color:#3f6ca3; }

  #edbox { position:fixed; z-index:30; left:50%; top:10%; transform:translateX(-50%);
    width:min(560px,94vw); background:#1b222a; border:1px solid var(--line); border-radius:12px;
    padding:14px; display:none; box-shadow:0 12px 40px #000c; }
  #edbox h4 { margin:0 0 8px; font-size:13px; display:flex; gap:8px; align-items:center; }
  #edbox input, #edbox textarea, #edbox select { background:#0d1014; color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:12.5px/1.4 inherit; }
  #edbox input[type=number] { width:64px; }
  #ed-title { width:100%; }
  #ed-body { width:100%; height:180px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  #edbox .row { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  #edbox .row.end { justify-content:flex-end; }
  #edbox label { color:var(--dim); font-size:11.5px; }
  #ed-url { flex:1; min-width:180px; }
  #edbox button.go { background:#2b4a71; border-color:#3f6ca3; }

  #toast { position:fixed; bottom:64px; left:50%; transform:translateX(-50%); z-index:40;
    background:#1b222a; border:1px solid var(--line); border-radius:20px; padding:7px 16px;
    font-size:12px; color:var(--ink); opacity:0; transition:opacity .3s; pointer-events:none;
    max-width:80vw; }
</style>
</head>
<body>
<div id="viewport"><div id="world"></div></div>
<div id="band"></div>

<div id="bar">
  <b>🪶 {{AGENT_NAME}}</b>
  <button id="fit">fit</button>
  <button id="newcard">+ new</button>
  <!-- find a card by number (the operator 2026-07-29, #387): paste "123" or "#123",
       hit find/Enter → pan+zoom to it, select + open it -->
  <input id="findn" inputmode="numeric" placeholder="#…">
  <button id="find">find</button>
  <!-- back to the card/view you were on before the last find (the operator 2026-07-29, #393) -->
  <button id="back" disabled>back</button>
  <span id="ergrun"></span>
  <!-- kind legend removed (the operator 2026-07-29, #303) — cards state their kind -->
  <span class="leg">tap=open · tap away=close · ⇧tap=multi · ⇧drag=lasso · drag card=move · 2×tap=edit</span>
  <span id="limits" title="subscription usage — 5h + weekly (all models) + fable weekly (API bucket 7d_oi), per token. Refreshes when an erg finishes while this page is open; no background polling.">…</span>
  <span id="stamp"></span>
</div>

<div id="abar">
  <span id="a-info"></span>
  <button id="a-child">+ child</button>
  <button id="a-edit">✏️ edit</button>
  <button id="a-done">✓ done</button>
  <button id="a-arch">📥 archive</button>
  <button id="a-unarch">⬆ un-archive</button>
  <button id="a-erg" class="go">⚡ erg</button>
  <button id="a-clear">✕</button>
</div>

<div id="edbox">
  <h4 id="ed-head">edit</h4>
  <input id="ed-title" placeholder="title (one line, optional)">
  <div class="row">
    <select id="ed-kind">
      <option>human</option><option>{{AGENT_NAME}}</option>
      <option>short-term</option><option>long-term</option><option>mind</option>
      <option>header</option>
    </select>
    <label>imp <input id="ed-imp" type="number" min="1" max="10"></label>
    <label>urg <input id="ed-urg" type="number" min="1" max="10"></label>
    <input id="ed-url" placeholder="url (optional)">
  </div>
  <div class="row"><textarea id="ed-body" placeholder="body (markdown)"></textarea></div>
  <div class="row end">
    <button id="ed-cancel">cancel</button>
    <button id="ed-save" class="go">save</button>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ---- key (same slot as the old watch-page: #k=… → localStorage) ---- */
if (location.hash.startsWith('#k=')) {
  localStorage.{{AGENT_NAME}}key = location.hash.slice(3);
  history.replaceState(null, '', location.pathname);
}
const K = localStorage.{{AGENT_NAME}}key || '';

const world = document.getElementById('world'), vp = document.getElementById('viewport');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2200); };

/* ---- timestamps: db stores UTC ISO ("…Z"); render in the BROWSER's timezone
   (the operator 2026-07-29, #292). Short form on every card, full form in tooltip +
   expanded meta line. */
function fmtTsShort(iso) {
  const t = Date.parse(iso || ''); if (!Number.isFinite(t)) return '';
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return hm;
  const yd = new Date(now); yd.setDate(now.getDate() - 1);
  if (d.toDateString() === yd.toDateString()) return 'yesterday ' + hm;
  const md = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return d.getFullYear() === now.getFullYear() ? md : md + ' ' + d.getFullYear();
}
function fmtTsFull(iso) {
  const t = Date.parse(iso || '');
  return Number.isFinite(t)
    ? new Date(t).toLocaleString([], { weekday: 'short', year: 'numeric',
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    : '?';
}

/* inline markdown: code, [text](url), bare urls, bold, italic — line-safe */
function inlineMd(t) {
  let h = esc(t);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(^|[\s(>])((?:https?:\/\/)[^\s<>"')]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
  return h;
}
/* cheap preview renderer (collapsed cards — kept minimal for speed) */
const md = (s) => inlineMd(s).replace(/\n/g, '<br>');
/* full block markdown for the OPEN view (the operator 2026-07-29, #374):
   fenced code, headings, lists, blockquotes, hr, paragraphs */
function mdFull(s) {
  const src = String(s ?? '').split('\n');
  const out = []; let i = 0, list = null, para = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>'); para = []; } };
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  while (i < src.length) {
    const t = src[i].trim(); let m;
    if (t.startsWith('```')) {
      flushPara(); closeList();
      const code = []; i++;
      while (i < src.length && !src[i].trim().startsWith('```')) code.push(src[i++]);
      i++;                                             // skip closing fence
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue;
    }
    if (!t) { flushPara(); closeList(); i++; continue; }
    if ((m = t.match(/^(#{1,4})\s+(.*)/))) { flushPara(); closeList();
      const l = m[1].length;
      out.push('<h' + l + '>' + inlineMd(m[2]) + '</h' + l + '>'); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushPara(); closeList(); out.push('<hr>'); i++; continue; }
    if ((m = t.match(/^[-*+]\s+(.*)/))) { flushPara();
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inlineMd(m[1]) + '</li>'); i++; continue; }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))) { flushPara();
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inlineMd(m[1]) + '</li>'); i++; continue; }
    if ((m = t.match(/^>\s?(.*)/))) { flushPara(); closeList();
      const q = [m[1]]; i++;
      while (i < src.length && (m = src[i].trim().match(/^>\s?(.*)/))) { q.push(m[1]); i++; }
      out.push('<blockquote>' + q.map(inlineMd).join('<br>') + '</blockquote>'); continue; }
    closeList(); para.push(src[i]); i++;
  }
  flushPara(); closeList();
  return out.join('');
}

/* ---- state ---- */
const CARDS = new Map();            // id -> card row
let LINKS = [], ERGS = [], VER = null, since = '';
const sel = new Set(), expanded = new Set();
/* expanded cards persist across reloads (the operator 2026-07-29, #295): render
   write-throughs the set; boot restores it (re-selecting too, since render
   collapses any expanded card that isn't selected). */
const saveExp = () => {
  try { localStorage.{{AGENT_NAME}}Exp = JSON.stringify([...expanded]); } catch (_) {} };
let editorOpen = false, pendingRender = false;
/* fresh-card tracking (the operator 2026-07-29, #372): per-browser set of card ids this
   board has "touched" (tap/expand/drag/lasso/link-open/create). null until the
   first poll seeds it — first-ever visit marks everything seen (no retro-glow). */
let seen = null;
const saveSeen = () => { try { localStorage.{{AGENT_NAME}}Seen = JSON.stringify([...seen]); } catch (_) {} };
function markSeen(ids) {
  if (!seen) return false;
  let changed = false;
  for (const id of ids) if (!seen.has(id)) { seen.add(id); changed = true; }
  if (changed) saveSeen();
  return changed;
}
const V = { s: .7, tx: 60, ty: 120 };
/* pan/zoom persists across refreshes (the operator 2026-07-29, #278): every apply()
   debounce-saves V; boot restores it (fitAll only on first-ever visit). */
let viewSaveT = null;
const saveView = () => { clearTimeout(viewSaveT); viewSaveT = setTimeout(() => {
  try { localStorage.{{AGENT_NAME}}View = JSON.stringify(V); } catch (_) {} }, 150); };
const apply = () => { world.style.transform = `translate(${V.tx}px,${V.ty}px) scale(${V.s})`; saveView(); };

async function act(p) {
  try {
    const r = await fetch('/act?k=' + K, { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(p) });
    const d = await r.json();
    if (!d.ok) { toast('⚠ ' + (d.error || r.status)); return null; }
    return d;
  } catch (e) { toast('⚠ ' + e.message); return null; }
}

/* ---- poll: full first, then ?since= deltas; reload on ver flip ---- */
let lastErgsJson = '', lastLinksJson = '';
async function poll() {
  let d;
  try {
    const r = await fetch('/data?k=' + K + (since ? '&since=' + encodeURIComponent(since) : ''));
    d = await r.json();
  } catch (e) { $('stamp').textContent = '⚠ offline'; return; }
  if (!d.ok) { document.body.innerHTML = '<p style="padding:80px 20px">⚠ ' + esc(d.error) +
    ' — open with #k=&lt;key&gt;</p>'; return; }
  if (VER === null) VER = d.ver;
  else if (d.ver !== VER) return location.reload();
  const keep = new Set(d.ids);
  let removed = false;
  for (const id of [...CARDS.keys()])
    if (!keep.has(id)) { CARDS.delete(id); sel.delete(id); removed = true; }
  for (const c of d.cards) CARDS.set(c.id, c);
  const ej = JSON.stringify(d.ergs), lj = JSON.stringify(d.links);
  const changed = d.cards.length || removed || ej !== lastErgsJson || lj !== lastLinksJson;
  LINKS = d.links; ERGS = d.ergs; lastErgsJson = ej; lastLinksJson = lj;
  // erg finished while we watched → capture fresh limit dials
  // ("data from the most recent erg" — the probe rides the erg's tail)
  const nowRun = new Set(ERGS.filter((e) => e.status === 'running' && e.alive).map((e) => e.id));
  if (runningErgs) for (const id of runningErgs)
    if (!nowRun.has(id)) { fetchLimits(true, 'erg-end'); break; }
  runningErgs = nowRun;
  since = d.generated_at;
  $('stamp').textContent = d.generated_at.slice(11, 16) + 'Z · ' + CARDS.size + ' cards';
  if (changed) render();
}

/* ---- geometry ---- */
const cw = (c) => c.w || 240, ch = (c) => c.h || 96;
let posCache = new Map();
function dispPos(c, depth) {
  if (c.x != null && c.y != null) return { x: c.x, y: c.y };
  const hit = posCache.get(c.id); if (hit) return hit;
  let p = { x: 2400 + (c.id % 7) * 40, y: 100 + (c.id % 9) * 60 };   // orphan fallback (interface quadrant)
  if ((depth || 0) < 6) {
    const parents = LINKS.filter((l) => l.child === c.id && l.kind === 'child')
      .map((l) => CARDS.get(l.parent)).filter(Boolean);
    if (parents.length) {
      let best = null, by = -Infinity;
      for (const par of parents) {
        const pp = dispPos(par, (depth || 0) + 1);
        if (pp.y > by) { by = pp.y; best = { par, pp }; }
      }
      p = { x: best.pp.x + 26 + (c.id % 5) * 10, y: best.pp.y + ch(best.par) + 70 };
    }
  }
  posCache.set(c.id, p);
  return p;
}
/* archived cards are ALWAYS visible in their quadrant (the operator 2026-07-28, #256b) */
const visible = () => true;

/* interface quadrant = lower-right (x>0, y>0 by card center). No arrows may
   cross its boundary: edges between the interaction area and ANY other
   quadrant are hidden (the operator 2026-07-30, #431). */
const inInterfaceQ = (c, p) => p.x + cw(c) / 2 > 0 && p.y + ch(c) / 2 > 0;

/* edge geometry — shared by render() and the live drag update (the operator 2026-07-29, #313) */
function edgeD(kind, a, b, pa, pb) {
  if (kind === 'child') {
    const x1 = pa.x + cw(a) / 2, y1 = pa.y + ch(a), x2 = pb.x + cw(b) / 2, y2 = pb.y;
    return `M${x1},${y1} C${x1},${y1 + 26} ${x2},${y2 - 26} ${x2},${y2 - 3}`;
  }
  /* ref: drawn child→parent so the arrowhead sits on the REFERENCED card
     (link rows store parent = referenced, child = referencer — see card.js) */
  const x1 = pb.x, y1 = pb.y + ch(b) / 2, x2 = pa.x + cw(a) + 3, y2 = pa.y + ch(a) / 2;
  return `M${x1},${y1} C${x1 - 50},${y1} ${x2 + 50},${y2} ${x2},${y2}`;
}

/* parent-link chips for the OPEN view (the operator 2026-07-29, #408): every upward
   link of this card — '↑ #n' = parent (child-kind), '⇢ ref #n' = a card this
   one references — each with a ✕ that breaks that single link (confirm first). */
function plinksHtml(id) {
  const ups = LINKS.filter((l) => l.child === id);
  if (!ups.length) return '';
  return '<div class="plinks">' + ups.map((l) =>
    `<span class="pl">${l.kind === 'ref' ? '⇢ ref' : '↑'} #${l.parent}` +
    `<button class="b-unlink" data-p="${l.parent}" data-c="${id}"` +
    ` title="break this ${l.kind === 'ref' ? 'ref' : 'parent'} link (#${l.parent} → #${id})">✕</button></span>`
  ).join('') + '</div>';
}

/* pulsing = being worked right now: locked by / output-card of a live running erg */
function inFlight() {
  const hot = new Set(), live = new Set();
  for (const e of ERGS) if (e.status === 'running' && e.alive) {
    live.add(e.id);
    if (e.info_card) hot.add(e.info_card);
    if (e.target_card) hot.add(e.target_card);
  }
  for (const c of CARDS.values()) if (c.lock_erg != null && live.has(c.lock_erg)) hot.add(c.id);
  return hot;
}

/* ---- render (full rebuild; deferred while fingers down or editor open) ---- */
function render() {
  if (ptrs.size || editorOpen) { pendingRender = true; return; }
  pendingRender = false;
  for (const id of [...expanded]) if (!sel.has(id)) expanded.delete(id);  // deselected → unexpand
  saveExp();
  posCache = new Map();
  const hot = inFlight();
  const cards = [...CARDS.values()].filter(visible);
  const pos = new Map();
  for (const c of cards) pos.set(c.id, dispPos(c));

  let svg = `<svg width="10" height="10">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#617182"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#b58a3d"/></marker></defs>
    <line class="axis" x1="-9000" y1="0" x2="12000" y2="0"/>
    <line class="axis" x1="0" y1="-6000" x2="0" y2="12000"/>
    <text class="qlbl" x="40" y="-46">live memory</text>
    <text class="qlbl" x="-160" y="-46" text-anchor="end">long-term</text>
    <text class="qlbl" x="40" y="60">interface</text>
    <text class="qlbl" x="-160" y="60" text-anchor="end">archive</text>`;
  for (const l of LINKS) {
    const a = CARDS.get(l.parent), b = CARDS.get(l.child);
    if (!a || !b || !visible(a) || !visible(b)) continue;
    if ((a.status === 'archived') !== (b.status === 'archived')) continue;  // no edges across the archive boundary
    const pa = pos.get(a.id), pb = pos.get(b.id);
    if (inInterfaceQ(a, pa) !== inInterfaceQ(b, pb)) continue;  // no arrows in/out of the interface quadrant (#431)
    const d = edgeD(l.kind, a, b, pa, pb);
    /* data-p/data-c let the drag loop retarget these paths live (#313) */
    if (l.kind === 'child') {
      svg += `<path class="e-child" data-p="${a.id}" data-c="${b.id}" marker-end="url(#ah)" d="${d}"/>`;
    } else {
      svg += `<path class="e-ref" data-p="${a.id}" data-c="${b.id}" marker-end="url(#ahr)" d="${d}"/>`;
    }
  }
  svg += '</svg>';

  let html = svg;
  const stGlyph = { draft: '●', ready: '●', done: '✓ done', archived: '📥' };  // draft = live; 'ready' retired 2026-07-28 (glyph kept for stragglers)
  const stColor = { draft: '#6fb3e8', ready: '#6fb3e8', done: '#5fc88f', archived: '#8a97a5' };
  for (const c of cards) {
    const p = pos.get(c.id);
    const fresh = seen && !seen.has(c.id);
    const cls = ['node', 'k-' + c.kind, 'st-' + c.status,
      c.status === 'archived' ? 'arch' : '', sel.has(c.id) ? 'sel' : '',
      hot.has(c.id) ? 'pulse' : '', fresh ? 'fresh' : '',
      expanded.has(c.id) ? 'expanded' : ''].join(' ');
    if (c.kind === 'header') {           // big-font section title, no chrome (#425)
      html += `<div class="${cls}" data-id="${c.id}" style="left:${p.x}px;top:${p.y}px">
        <div class="httl">${esc(c.title)}</div></div>`;
      continue;
    }
    const iu = (c.importance || c.urgency) ? ` · i${c.importance ?? '·'}u${c.urgency ?? '·'}` : '';
    const lk = c.lock_erg != null ? ' 🔒' : '';
    const isChip = c.kind === 'long-term' && !expanded.has(c.id);
    const tsTip = 'created ' + fmtTsFull(c.created_at) + ' by ' + c.created_by +
      (c.updated_at !== c.created_at ? ' · updated ' + fmtTsFull(c.updated_at) : '');
    html += `<div class="${cls}" data-id="${c.id}"
        style="left:${p.x}px;top:${p.y}px;width:${cw(c)}px;height:${isChip ? 34 : ch(c)}px">
      <div class="top"><span>#${c.id}</span>${fresh ? '<span class="nb">✦ new</span>' : ''}<span class="st" style="color:${stColor[c.status]}">${stGlyph[c.status]}</span><span>${esc(c.kind)}${iu}${lk}</span><span class="ts" title="${esc(tsTip)}">${esc(fmtTsShort(c.created_at))}</span></div>
      <div class="ttl">${esc(c.title)}</div>` +
      (isChip ? '' : `<div class="txt">${expanded.has(c.id) ? mdFull(c.body) : md(c.body)}</div>`) +
      (expanded.has(c.id) ? plinksHtml(c.id) + `<div class="meta">${esc(tsTip)}</div>` : '') +
      `<div class="btns"><button class="b-x" title="expand">${expanded.has(c.id) ? '🗕' : '⤢'}</button>` +
      (c.url ? `<button class="b-url" data-url="${esc(c.url)}" title="open link">↗</button>` : '') +
      `</div></div>`;
  }
  world.innerHTML = html;
  updateBars();
}

function updateBars() {
  const n = ERGS.filter((e) => e.status === 'running' && e.alive).length;
  const er = $('ergrun');
  er.style.display = n ? '' : 'none';
  er.textContent = '⚙ ' + n + ' erg' + (n > 1 ? 's' : '') + ' running';
  const ab = $('abar');
  if (!sel.size) { ab.style.display = 'none'; return; }
  ab.style.display = 'flex';
  const cs = [...sel].map((id) => CARDS.get(id)).filter(Boolean);
  $('a-info').textContent = cs.length === 1 ? '#' + cs[0].id : cs.length + ' cards';
  $('a-done').style.display = cs.some((c) => c.status === 'draft' || c.status === 'ready') ? '' : 'none';
  $('a-arch').style.display = cs.some((c) => c.status !== 'archived') ? '' : 'none';
  $('a-unarch').style.display = cs.some((c) => c.status === 'archived') ? '' : 'none';
  $('a-edit').style.display = cs.length === 1 ? '' : 'none';
  $('a-erg').style.display = cs.every((c) => c.status !== 'archived') ? '' : 'none';
}

/* ---- pan / zoom / drag / lasso / tap ----
   NB (from the mac board): setPointerCapture retargets pointer events to #viewport,
   so remember the element under the finger at pointerDOWN — all tap logic runs
   off downTarget, and pointerup's e.target is useless. */
const ptrs = new Map();
let moved = 0, pinch0 = null, downTarget = null, down0 = null;
let mode = null;                       // 'pan' | 'band' | 'card'
let dragIds = null, dragOrig = null;   // card-drag state
let dragPaths = null;                  // svg paths touching dragged cards (#313)
let lastTap = { id: null, t: 0 };

vp.addEventListener('pointerdown', (e) => {
  /* text inside an OPEN card is natively selectable (the operator 2026-07-29, #374):
     don't capture the pointer there — the browser handles selection. Links are
     excluded so tap() stays their sole opener; drag/move an open card by its
     header row or edges. */
  if (ptrs.size === 0 && e.target.closest && !e.target.closest('a') &&
      e.target.closest('.node.expanded') && e.target.closest('.ttl,.txt,.meta')) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0;
  if (ptrs.size === 1) {
    downTarget = e.target; down0 = { x: e.clientX, y: e.clientY };
    const node = e.target.closest && e.target.closest('.node');
    mode = node ? 'card' : (e.shiftKey ? 'band' : 'pan');
    if (mode === 'band') { const b = $('band'); b.style.display = 'block';
      Object.assign(b.style, { left: down0.x + 'px', top: down0.y + 'px', width: '0px', height: '0px' }); }
  }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()];
    pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s }; downTarget = null; mode = 'pinch'; }
  vp.classList.add('panning'); vp.setPointerCapture(e.pointerId);
});

vp.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2 && pinch0) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const ns = Math.min(2.5, Math.max(.05, pinch0.s * d / pinch0.d));
    V.tx = mx - (mx - V.tx) * ns / V.s; V.ty = my - (my - V.ty) * ns / V.s; V.s = ns; apply();
    return;
  }
  if (ptrs.size !== 1) return;
  if (mode === 'pan') { V.tx += dx; V.ty += dy; apply(); return; }
  if (mode === 'band') {
    const b = $('band');
    Object.assign(b.style, {
      left: Math.min(down0.x, e.clientX) + 'px', top: Math.min(down0.y, e.clientY) + 'px',
      width: Math.abs(e.clientX - down0.x) + 'px', height: Math.abs(e.clientY - down0.y) + 'px' });
    return;
  }
  if (mode === 'card' && moved >= 7) {
    if (!dragIds) {                                    // drag begins
      const node = downTarget.closest('.node');
      const id = +node.dataset.id;
      if (!sel.has(id)) { sel.clear(); sel.add(id); }
      dragIds = [...sel];
      markSeen(dragIds);                               // dragging = touched (#372)
      dragOrig = new Map(dragIds.map((cid) => {
        const c = CARDS.get(cid); const dp = dispPos(c);
        return [cid, { x: dp.x, y: dp.y }];
      }));
      for (const el of world.querySelectorAll('.node'))
        el.classList.toggle('sel', sel.has(+el.dataset.id));
      updateBars();
      // cache the arrows touching any dragged card once, so each move is cheap (#313)
      const ds = new Set(dragIds);
      dragPaths = [...world.querySelectorAll('path[data-p]')].filter((p) =>
        ds.has(+p.dataset.p) || ds.has(+p.dataset.c));
    }
    const dxw = (e.clientX - down0.x) / V.s, dyw = (e.clientY - down0.y) / V.s;
    for (const cid of dragIds) {
      const o = dragOrig.get(cid);
      const el = world.querySelector(`.node[data-id="${cid}"]`);
      if (el) { el.style.left = (o.x + dxw) + 'px'; el.style.top = (o.y + dyw) + 'px'; }
    }
    // arrows follow the cards live during the drag (the operator 2026-07-29, #313)
    if (dragPaths) {
      const posOf = (cid) => {
        const o = dragOrig.get(cid);
        if (o) return { x: o.x + dxw, y: o.y + dyw };          // dragged endpoint
        const c = CARDS.get(cid); return c ? dispPos(c) : null; // stationary endpoint
      };
      for (const path of dragPaths) {
        const a = CARDS.get(+path.dataset.p), b = CARDS.get(+path.dataset.c);
        const pa = posOf(+path.dataset.p), pb = posOf(+path.dataset.c);
        if (!a || !b || !pa || !pb) continue;
        // hide live when a drag pulls an edge across the interface boundary (#431)
        path.style.display = inInterfaceQ(a, pa) !== inInterfaceQ(b, pb) ? 'none' : '';
        path.setAttribute('d', edgeD(
          path.classList.contains('e-child') ? 'child' : 'ref', a, b, pa, pb));
      }
    }
  }
});

vp.addEventListener('pointerup', async (e) => {
  ptrs.delete(e.pointerId); pinch0 = null;
  if (ptrs.size === 0) vp.classList.remove('panning');
  const t = downTarget, m = mode, wasDrag = !!dragIds;
  if (ptrs.size === 0) { downTarget = null; mode = null; }

  if (m === 'band' && ptrs.size === 0) {
    $('band').style.display = 'none';
    const x1 = (Math.min(down0.x, e.clientX) - V.tx) / V.s, x2 = (Math.max(down0.x, e.clientX) - V.tx) / V.s;
    const y1 = (Math.min(down0.y, e.clientY) - V.ty) / V.s, y2 = (Math.max(down0.y, e.clientY) - V.ty) / V.s;
    for (const c of CARDS.values()) {
      if (!visible(c)) continue;
      const p = dispPos(c);
      if (p.x < x2 && p.x + cw(c) > x1 && p.y < y2 && p.y + ch(c) > y1) sel.add(c.id);
    }
    markSeen([...sel]);                                // lasso = touched (#372)
    render(); return;
  }

  if (wasDrag && ptrs.size === 0) {                    // commit card drag
    const dxw = (e.clientX - down0.x) / V.s, dyw = (e.clientY - down0.y) / V.s;
    const rel = [], abs = [];
    for (const cid of dragIds) {
      const c = CARDS.get(cid); if (!c) continue;
      if (c.x == null || c.y == null) abs.push(cid); else rel.push(cid);
      const o = dragOrig.get(cid); c.x = o.x + dxw; c.y = o.y + dyw;   // local write-through
    }
    dragIds = null; dragOrig = null; dragPaths = null;
    if (Math.abs(dxw) + Math.abs(dyw) > .5) {
      if (rel.length) await act({ action: 'move', ids: rel, dx: dxw, dy: dyw });
      for (const cid of abs) {
        const c = CARDS.get(cid);
        if (c) await act({ action: 'edit', id: cid, x: c.x, y: c.y });
      }
    }
    render(); return;
  }

  if (moved < 7 && t && ptrs.size === 0) tap(t, e);
});
vp.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); pinch0 = null;
  dragIds = null; dragOrig = null; dragPaths = null; $('band').style.display = 'none'; });

vp.addEventListener('wheel', (e) => {
  e.preventDefault();
  const ns = Math.min(2.5, Math.max(.05, V.s * Math.exp(-e.deltaY * .0014)));
  V.tx = e.clientX - (e.clientX - V.tx) * ns / V.s; V.ty = e.clientY - (e.clientY - V.ty) * ns / V.s;
  V.s = ns; apply();
}, { passive: false });
/* open url in a NEW TAB. Not window.open(url,'_blank','noopener'): passing a
   features string makes Chrome open a popup *window*; and native <a> clicks
   never fire here anyway — setPointerCapture retargets the click to #viewport,
   so links are opened from tap() below (off downTarget). */
function openTab(url) {
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.click();
}
world.addEventListener('click', (e) => {   // some browsers do deliver the click
  if (e.target.closest('a')) e.preventDefault();  // to the <a>: suppress native
});                                        // nav so tap() stays the sole opener

/* ---- tap dispatch (t = element captured at pointerdown) ---- */
function tap(t, e) {
  if (t.closest('#bar') || t.closest('#abar') || t.closest('#edbox')) return;
  const link = t.closest('a');
  if (link) { openTab(link.href); return; }            // click is capture-retargeted; open here
  const node = t.closest('.node');
  if (!node) {                                         // empty tap: clear selection
    if (sel.size) { sel.clear(); render(); }
    return;
  }
  const id = +node.dataset.id;
  const wasFresh = markSeen([id]);                     // any tap on a card = touched (#372)
  if (t.classList.contains('b-url')) { openTab(t.dataset.url); if (wasFresh) render(); return; }
  if (t.classList.contains('b-unlink')) {              // break a parent/ref link (#408)
    const par = +t.dataset.p, chd = +t.dataset.c;
    if (!confirm('break link #' + par + ' → #' + chd + '?')) return;
    act({ action: 'unlink', parent: par, child: chd })
      .then((r) => { if (r) { toast('✂ link #' + par + ' → #' + chd + ' broken'); poll(); } });
    return;
  }
  if (t.classList.contains('b-x')) {
    if (expanded.has(id)) expanded.delete(id);
    else {                                             // expanding selects the card
      expanded.add(id);                                // (render collapses any card
      if (!(e.shiftKey || e.ctrlKey || e.metaKey)) sel.clear();  // not in sel)
      sel.add(id);
    }
    render(); return;
  }
  const now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 420) {    // double-tap → edit
    lastTap = { id: null, t: 0 };
    openEditor(CARDS.get(id)); return;
  }
  lastTap = { id, t: now };
  const meta = e.shiftKey || e.ctrlKey || e.metaKey;
  if (meta) { sel.has(id) ? sel.delete(id) : sel.add(id); }
  else { sel.clear(); sel.add(id);                   // tap OPENS (the operator 2026-07-29, #374)
    const cc = CARDS.get(id);                        // …except headers: nothing to open (#425)
    if (!cc || cc.kind !== 'header') { expanded.add(id); saveExp(); } }
  render();
}

/* ---- editor (create + edit) ---- */
let edCard = null, edParents = null;
function openEditor(c, parents) {
  edCard = c || null; edParents = parents || null; editorOpen = true;
  $('ed-head').textContent = c ? `edit #${c.id} (${c.kind})`
    : parents && parents.length ? '+ child of ' + parents.map((p) => '#' + p).join(' ') : '+ new card';
  $('ed-kind').style.display = c ? 'none' : '';
  $('ed-kind').value = c ? c.kind : 'human';   // the operator's UI → his cards default to human
  $('ed-title').value = c ? c.title : '';
  $('ed-body').value = c ? c.body : '';
  $('ed-url').value = (c && c.url) || '';
  $('ed-imp').value = (c && c.importance) || '';
  $('ed-urg').value = (c && c.urgency) || '';
  $('edbox').style.display = 'block';
  $('ed-title').focus();
  saveEd();
}
function closeEditor() { $('edbox').style.display = 'none'; editorOpen = false;
  try { localStorage.removeItem('{{AGENT_NAME}}Ed'); } catch (_) {}
  if (pendingRender) render(); }

/* editor dialog persists across refreshes (the operator 2026-07-29, #278): every
   keystroke saves open-state + fields; boot reopens it with the text intact. */
function saveEd() {
  if (!editorOpen) return;
  try { localStorage.{{AGENT_NAME}}Ed = JSON.stringify({
    id: edCard ? edCard.id : null, parents: edParents,
    kind: $('ed-kind').value, title: $('ed-title').value, body: $('ed-body').value,
    url: $('ed-url').value, imp: $('ed-imp').value, urg: $('ed-urg').value }); } catch (_) {}
}
for (const fid of ['ed-title', 'ed-body', 'ed-url', 'ed-imp', 'ed-urg', 'ed-kind']) {
  $(fid).addEventListener('input', saveEd);
  $(fid).addEventListener('change', saveEd);
}
function restoreEditor() {
  let s; try { s = JSON.parse(localStorage.{{AGENT_NAME}}Ed || 'null'); } catch (_) { return; }
  if (!s) return;
  const c = s.id != null ? CARDS.get(s.id) : null;
  openEditor(c, c ? null : (s.parents || null));   // card gone → fall back to new-card, text kept
  if (!c) $('ed-kind').value = s.kind || 'human';
  $('ed-title').value = s.title || '';
  $('ed-body').value = s.body || '';
  $('ed-url').value = s.url || '';
  $('ed-imp').value = s.imp || '';
  $('ed-urg').value = s.urg || '';
  saveEd();
  if (s.id != null && !c) toast('⚠ card #' + s.id + ' is gone — restored your text as a new card');
}
$('ed-cancel').onclick = closeEditor;
$('ed-save').onclick = async () => {
  const title = $('ed-title').value.trim();
  const body = $('ed-body').value, url = $('ed-url').value.trim();
  const imp = $('ed-imp').value ? +$('ed-imp').value : null;
  const urg = $('ed-urg').value ? +$('ed-urg').value : null;
  let r;
  if (edCard) {
    r = await act({ action: 'edit', id: edCard.id, title, body, url, imp, urg });
    if (r) toast('saved #' + edCard.id);
  } else {
    const p = { action: 'create', kind: $('ed-kind').value, title, body, imp, urg,
      parents: edParents || [] };
    if (url) p.url = url;
    if (edParents && edParents.length) {               // place below lowest parent
      let bx = null, by = -Infinity, bh = 96;
      for (const pid of edParents) { const pc = CARDS.get(pid); if (!pc) continue;
        const pp = dispPos(pc); if (pp.y > by) { by = pp.y; bx = pp.x; bh = ch(pc); } }
      if (bx != null) { p.x = bx + 26; p.y = by + bh + 70; }
    } else { p.x = (innerWidth / 2 - V.tx) / V.s - 120; p.y = (innerHeight / 2 - V.ty) / V.s - 48; }
    r = await act(p);
    if (r) { toast('created #' + r.id); sel.clear(); sel.add(r.id); markSeen([r.id]); }
  }
  if (!r) return;      // save failed → keep dialog (and its text) open
  closeEditor();
  poll();
};

/* ---- action bar ---- */
const selCards = () => [...sel].map((id) => CARDS.get(id)).filter(Boolean);
$('a-clear').onclick = () => { sel.clear(); render(); };
$('a-child').onclick = () => openEditor(null, [...sel]);
$('a-edit').onclick = () => { const c = selCards()[0]; if (c) openEditor(c); };
async function setStatus(pick, st, label) {
  let n = 0;   // archive touches ONLY the picked cards (the operator 2026-07-29, #299 — no ancestor pull)
  for (const c of selCards()) if (pick(c)) {
    const r = await act({ action: 'status', id: c.id, status: st });
    if (r) n++;
  }
  if (n) toast(n + ' → ' + label);
  poll();
}
$('a-done').onclick = () => setStatus((c) => c.status === 'draft' || c.status === 'ready', 'done', 'done ✓');
$('a-arch').onclick = () => setStatus((c) => c.status !== 'archived', 'archived', 'archived 📥');
$('a-unarch').onclick = () => setStatus((c) => c.status === 'archived', 'done', 'un-archived (done)');
$('a-erg').onclick = async () => {
  const ids = [...sel];
  if (!ids.length) return;
  const r = await act({ action: 'erg', card_ids: ids });
  if (r) toast('⚡ erg spawned (pid ' + r.pid + ')');
  sel.clear(); poll();
};

/* ---- limits dials (ported from the watch-page — M5 follow-up, card #252) ----
   No timer probes anything. The server caches the last probe in web/limits.json;
   we re-probe ONLY on: an erg finishing while this page is open (detected in
   poll()), page load with a stale cache (>15 min), or the ↻ button. The server
   debounces to one probe per 90s regardless. fable-wk = API bucket 7d_oi. */
let limitsAt = 0, limitsData = null, runningErgs = null;
const LIMIT_BUCKETS = [['5h', '5h'], ['7d', '7d'], ['7d_oi', 'fable-wk']];
const LIMIT_WIN = { '5h': 5 * 3600e3, '7d': 7 * 86400e3, '7d_oi': 7 * 86400e3 }; // window lengths (ms)
const fmtReset = (ms) => ms ? new Date(ms).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '?';
function renderLimits(d) {
  limitsData = d;
  const rows = (d.slots || []).map((s) => {
    if (s.error) return '<span class="tok"><span class="tn">tok' + s.slot + '</span> <span class="dial crit"><b>probe failed: ' + esc(String(s.error)) + '</b></span></span>';
    const dials = LIMIT_BUCKETS.map(([k, lab]) => {
      const b = s.buckets && s.buckets[k];
      if (!b) return '';
      const pct = Math.round(b.util * 100);
      const cls = pct >= 90 ? ' crit' : pct >= 75 ? ' warn' : '';
      const mark = pct >= 90 ? '‼' : pct >= 75 ? '⚠' : '';
      // bottom bar: % of the window already elapsed, derived from reset - now
      const ePct = b.reset ? Math.round(Math.max(0, Math.min(1, 1 - (b.reset - Date.now()) / LIMIT_WIN[k])) * 100) : null;
      const win = k === '5h' ? '5-hour' : '7-day';
      return '<span class="dial' + cls + '" title="' + lab + (k === '7d_oi' ? ' (API bucket 7d_oi — fable weekly)' : '') +
        ' · top bar: ' + pct + '% used · bottom bar: ' + (ePct === null ? '?' : ePct) + '% of the ' + win + ' window elapsed · resets ' + esc(fmtReset(b.reset)) + '">' +
        '<span>' + lab + ' <b>' + pct + '%' + mark + '</b></span>' +
        '<span class="bar use"><i style="width:' + pct + '%"></i></span>' +
        '<span class="bar time"><i style="width:' + (ePct === null ? 0 : ePct) + '%"></i></span></span>';
    }).join(' ');
    return '<span class="tok"><span class="tn">tok' + s.slot + '</span> ' + dials + '</span>';
  }).join('') || '<span class="dial">(no data yet — hit ↻)</span>';
  $('limits').innerHTML = '<span class="lab" title="subscription rate-limit dials — 5h window · weekly all-models · fable weekly">limits</span>' + rows +
    '<span class="asof">' + (d.at ? new Date(d.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + (d.why ? ' (' + esc(String(d.why)) + ')' : '') : 'never probed') + '</span>' +
    '<button id="limref" title="probe both tokens now (~2 tiny calls; server allows at most one probe per 90s)">↻</button>';
  $('limref').onclick = () => fetchLimits(true, 'manual');
}
async function fetchLimits(probe, why) {
  try {
    const r = await fetch('/limits?k=' + K + (probe ? '&probe=1&why=' + encodeURIComponent(why || 'page') : ''));
    const j = await r.json();
    if (j.ok) { limitsAt = j.at || 0; renderLimits(j); }
  } catch (_) {}
}

/* ---- top bar ---- */
function fitTo(cs) {
  if (!cs.length) return;
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const c of cs) { const p = dispPos(c);
    x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
    x2 = Math.max(x2, p.x + cw(c)); y2 = Math.max(y2, p.y + ch(c)); }
  const W = x2 - x1 + 120, H = y2 - y1 + 120;
  V.s = Math.max(Math.min((innerWidth - 30) / W, (innerHeight - 140) / H, 1.1), .04);
  V.tx = 15 - x1 * V.s + (innerWidth - 30 - W * V.s) / 2;
  V.ty = 100 - y1 * V.s + (innerHeight - 140 - H * V.s) / 2;
  apply();
}
/* fit = everything, archive quadrant included */
function fitAll() { fitTo([...CARDS.values()]); }
$('fit').onclick = fitAll;
$('newcard').onclick = () => openEditor(null, null);
/* find a card by number (the operator 2026-07-29, #387): accepts "123" or "#123";
   selects + opens the card and centers the view on it */
function findCard() {
  const m = $('findn').value.match(/\d+/);
  if (!m) { toast('paste a card number'); $('findn').focus(); return; }
  const id = +m[0], c = CARDS.get(id);
  if (!c) { toast('⚠ no card #' + id + ' on the board'); return; }
  pushBack();                                 // remember where we were (#393)
  sel.clear(); sel.add(id);
  expanded.add(id); saveExp();
  markSeen([id]);
  render();
  const p = dispPos(c);                       // center at a readable zoom
  V.s = Math.min(Math.max(V.s, .8), 1.1);
  V.tx = innerWidth / 2 - (p.x + cw(c) / 2) * V.s;
  V.ty = (innerHeight + 60) / 2 - (p.y + ch(c) / 2) * V.s;   // +60: clear the top bar
  apply();
  $('findn').value = ''; $('findn').blur();
}
$('find').onclick = findCard;
/* back button (the operator 2026-07-29, #393): each find pushes the pre-jump state
   (selection + viewport) onto a stack; back pops and restores it */
const backStack = [];
function pushBack() {
  backStack.push({ sel: [...sel], V: { s: V.s, tx: V.tx, ty: V.ty } });
  if (backStack.length > 50) backStack.shift();
  $('back').disabled = false;
}
$('back').onclick = () => {
  const st = backStack.pop();
  $('back').disabled = !backStack.length;
  if (!st) return;
  sel.clear();
  for (const id of st.sel) if (CARDS.has(id)) sel.add(id);
  for (const id of sel) expanded.add(id);      // OPEN the card we return to (the operator 2026-07-29, #410)
  if (sel.size) { saveExp(); markSeen([...sel]); }
  render();
  V.s = st.V.s; V.tx = st.V.tx; V.ty = st.V.ty;
  apply();
};
$('findn').addEventListener('keydown', (e) => {
  e.stopPropagation();                        // keep Escape-to-clear-selection off while typing
  if (e.key === 'Enter') findCard();
  else if (e.key === 'Escape') { $('findn').value = ''; $('findn').blur(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (editorOpen) return closeEditor();
    if (sel.size) { sel.clear(); render(); }
  }
});

/* ---- boot ---- */
(async () => {
  let savedV = null;
  try { savedV = JSON.parse(localStorage.{{AGENT_NAME}}View || 'null'); } catch (_) {}
  // restore expanded cards BEFORE the first poll/render: render collapses any
  // expanded card that isn't selected, so re-select them too (#295)
  try { for (const id of JSON.parse(localStorage.{{AGENT_NAME}}Exp || '[]'))
    if (Number.isInteger(id)) { expanded.add(id); sel.add(id); } } catch (_) {}
  await poll();
  // drop restored ids whose cards no longer exist (archived-away, deleted)
  for (const id of [...expanded]) if (!CARDS.has(id)) { expanded.delete(id); sel.delete(id); }
  // seed the seen-set (#372): stored set if any, else "everything current is
  // seen" so the feature starts quiet; prune dead ids to keep it bounded.
  try {
    const s = JSON.parse(localStorage.{{AGENT_NAME}}Seen || 'null');
    seen = Array.isArray(s) ? new Set(s.filter(Number.isInteger)) : new Set(CARDS.keys());
  } catch (_) { seen = new Set(CARDS.keys()); }
  for (const id of [...seen]) if (!CARDS.has(id)) seen.delete(id);
  saveSeen();
  render();                                  // first render ran with seen=null
  if (savedV && Number.isFinite(savedV.s) && savedV.s > 0
      && Number.isFinite(savedV.tx) && Number.isFinite(savedV.ty)) {
    Object.assign(V, savedV); apply();       // restore last pan/zoom
  } else fitAll();                           // first-ever visit
  restoreEditor();                           // reopen dialog + text if one was up
  setInterval(poll, 5000);
  // limits on load: show cache instantly; probe only if it's gone stale (>15 min)
  fetchLimits(false).then(() => { if (Date.now() - limitsAt > 15 * 60_000) fetchLimits(true, 'stale-on-load'); });
  // keep the elapsed-window (blue) bars honest without re-fetching anything
  setInterval(() => { if (limitsData) renderLimits(limitsData); }, 60_000);
})();
</script>
</body>
